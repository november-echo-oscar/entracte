<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfaf8">
    <meta name="description" content="Entracte - Mon Journal de Théâtre Personnel">
    
    <!-- Manifest pour l'installation PWA -->
    <link rel="manifest" href="manifest.json">
    
    <title>Entracte - Mon Journal de Théâtre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfaf8;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .theater-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .theater-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
        }
        .rating-badge {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .theater-card:hover .delete-btn {
            opacity: 1;
        }
        .critique-text {
            line-height: 1.8;
            white-space: pre-wrap;
        }

        /* Amélioration du slider pour mobile */
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 3px;
        }

        .modal-open {
            overflow: hidden;
        }

        .auth-transition {
            transition: opacity 0.5s ease;
        }

        /* État Offline */
        #offline-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
            z-index: 200;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Indicateur Hors-ligne -->
    <div id="offline-indicator"><i class="fas fa-wifi-slash mr-2"></i> Mode hors-ligne</div>

    <!-- ÉCRAN D'AUTHENTIFICATION -->
    <div id="auth-screen" class="fixed inset-0 bg-[#fcfaf8] z-[100] flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center">
            <h1 class="text-6xl font-black text-gray-900 tracking-tight mb-4">Entracte.</h1>
            <p class="text-gray-400 mb-12 text-lg italic">Votre carnet de loge personnel.</p>
            
            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" required placeholder="Votre email" class="w-full p-4 bg-white border border-gray-100 rounded-2xl outline-none shadow-sm focus:ring-2 focus:ring-black transition-all">
                <input type="password" id="auth-password" required placeholder="Mot de passe" class="w-full p-4 bg-white border border-gray-100 rounded-2xl outline-none shadow-sm focus:ring-2 focus:ring-black transition-all">
                
                <div class="pt-4 space-y-3">
                    <button type="submit" id="auth-submit-btn" class="w-full py-4 bg-black text-white rounded-2xl font-bold shadow-xl hover:scale-[1.02] active:scale-95 transition-all">
                        Se connecter
                    </button>
                    <button type="button" id="toggle-auth-mode" class="text-sm text-gray-400 hover:text-black transition">
                        Pas encore de compte ? S'inscrire
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTENU DE L'APPLICATION -->
    <div id="main-content" class="max-w-6xl mx-auto opacity-0 pointer-events-none auth-transition">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h1 class="text-6xl font-black text-gray-900 tracking-tight">Entracte.</h1>
                <div class="flex items-center gap-3 mt-2">
                    <p id="user-display" class="text-gray-400 text-sm font-medium"></p>
                    <span class="text-gray-200">|</span>
                    <button onclick="logout()" class="text-[10px] font-black text-gray-400 hover:text-red-500 uppercase tracking-widest transition">Déconnexion</button>
                </div>
            </div>
            <button onclick="openFormModal()" class="w-full md:w-auto bg-black text-white px-10 py-5 rounded-full hover:scale-105 active:scale-95 transition-all shadow-xl font-bold">
                Nouveau souvenir
            </button>
        </header>

        <div class="flex flex-col md:flex-row gap-4 mb-12">
            <div class="flex-grow relative group">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-black transition-colors"></i>
                <input type="text" id="search-input" oninput="filterPieces()" placeholder="Rechercher une œuvre, un lieu..." class="w-full pl-14 pr-6 py-4 rounded-3xl border-none shadow-sm focus:ring-2 focus:ring-black outline-none bg-white">
            </div>
        </div>

        <div id="theater-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div id="loading" class="col-span-full text-center py-20">
                <p class="text-gray-400 animate-pulse font-serif italic text-xl">Ouverture du rideau...</p>
            </div>
        </div>
    </div>

    <!-- MODAL LECTURE -->
    <div id="view-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50 backdrop-blur-md overflow-y-auto">
        <div class="bg-white rounded-[2.5rem] max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col my-auto">
            <div id="view-header-color" class="h-3 w-full"></div>
            <div class="p-6 md:p-10">
                <div class="flex justify-between items-start mb-6">
                    <div id="view-rating" class="rating-badge w-14 h-14 rounded-2xl flex items-center justify-center text-white font-black text-xl flex-shrink-0"></div>
                    <div class="flex gap-2">
                        <button id="edit-btn-trigger" class="text-gray-300 hover:text-black p-2 transition"><i class="fas fa-pen"></i></button>
                        <button onclick="closeModals()" class="text-gray-300 hover:text-black p-2 transition"><i class="fas fa-times text-xl"></i></button>
                    </div>
                </div>
                <h2 id="view-title" class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 break-words leading-tight"></h2>
                <p id="view-author" class="text-xl text-gray-500 font-medium mb-8"></p>
                <div class="grid grid-cols-2 gap-6 mb-8 pb-8 border-b border-gray-100">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400 font-bold mb-1">Lieu</p>
                        <p id="view-venue" class="font-semibold text-gray-800"></p>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400 font-bold mb-1">Date</p>
                        <p id="view-date" class="font-semibold text-gray-800"></p>
                    </div>
                </div>
                <div class="space-y-4 mb-4">
                    <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400 font-bold">Ma Critique</p>
                    <p id="view-critique" class="critique-text text-gray-700 italic serif text-lg"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FORMULAIRE -->
    <div id="form-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[60] backdrop-blur-sm overflow-y-auto">
        <div class="bg-white rounded-[2rem] p-8 md:p-10 max-w-xl w-full shadow-2xl my-auto">
            <h2 id="form-title" class="text-3xl font-bold mb-8">Nouveau Souvenir</h2>
            <form id="piece-form" class="space-y-5">
                <input type="hidden" id="edit-id">
                <input type="text" id="title" required placeholder="Titre de la pièce" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                <input type="text" id="author" required placeholder="Mise en scène / Compagnie" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="venue" placeholder="Le Théâtre" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                    <input type="date" id="view-date-input" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                </div>
                <div class="space-y-3 bg-gray-50 p-4 rounded-2xl">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-bold text-gray-500 uppercase tracking-wider">Note émotionnelle</label>
                        <span class="bg-black text-white px-3 py-1 rounded-lg font-bold text-sm"><span id="rating-val">3</span> / 5</span>
                    </div>
                    <input type="range" id="rating" min="0" max="5" step="0.5" value="3" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-black">
                </div>
                <textarea id="critique" rows="4" placeholder="Qu'avez-vous ressenti ?" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModals()" class="flex-1 py-4 font-bold text-gray-400">Fermer</button>
                    <button type="submit" class="flex-1 py-4 bg-black text-white rounded-2xl font-bold shadow-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, query, where, deleteDoc, doc, serverTimestamp, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdbffCQYoEj7Xq9e2kML65YtEMcTBBYO8",
            authDomain: "fir-84302.firebaseapp.com",
            projectId: "fir-84302",
            storageBucket: "fir-84302.firebasestorage.app",
            messagingSenderId: "856418485712",
            appId: "1:856418485712:web:19b408f133b2697cb5a5d5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ACTIVER LA PERSISTANCE HORS-LIGNE (Indispensable pour PWA)
        try {
            enableIndexedDbPersistence(db);
        } catch (err) {
            console.warn("La persistance hors-ligne n'a pas pu être activée.");
        }

        setPersistence(auth, browserLocalPersistence);

        let currentUser = null;
        let allPieces = [];
        let unsubscribe = null;
        let isSignUp = false;

        const authScreen = document.getElementById('auth-screen');
        const mainContent = document.getElementById('main-content');
        const authForm = document.getElementById('auth-form');
        const toggleAuthBtn = document.getElementById('toggle-auth-mode');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const offlineIndicator = document.getElementById('offline-indicator');

        // Gestion réseau
        window.addEventListener('online', () => offlineIndicator.style.display = 'none');
        window.addEventListener('offline', () => offlineIndicator.style.display = 'block');

        toggleAuthBtn.onclick = () => {
            isSignUp = !isSignUp;
            authSubmitBtn.innerText = isSignUp ? "Créer mon carnet" : "Se connecter";
            toggleAuthBtn.innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Première visite ? S'inscrire";
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                let msg = "Erreur d'accès au carnet.";
                if (err.code === 'auth/weak-password') msg = "Mot de passe trop court (6 min).";
                if (err.code === 'auth/email-already-in-use') msg = "Cet email est déjà pris.";
                if (err.code === 'auth/invalid-credential') msg = "Email ou mot de passe incorrect.";
                alert(msg);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                authScreen.style.display = 'none';
                mainContent.classList.remove('opacity-0', 'pointer-events-none');
                loadPieces();
            } else {
                currentUser = null;
                authScreen.style.display = 'flex';
                mainContent.classList.add('opacity-0', 'pointer-events-none');
                if (unsubscribe) unsubscribe();
            }
        });

        document.getElementById('rating').addEventListener('input', (e) => {
            document.getElementById('rating-val').innerText = e.target.value;
        });

        function getColorByRating(rating) {
            if (rating >= 4.5) return '#D4AF37'; 
            if (rating >= 4.0) return '#E67E22'; 
            if (rating >= 3.0) return '#706fd3'; 
            if (rating >= 2.0) return '#34ace0'; 
            return '#aaa69d'; 
        }

        function loadPieces() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, "pieces"), where("userId", "==", currentUser.uid));
            unsubscribe = onSnapshot(q, (snapshot) => {
                allPieces = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                allPieces.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                renderPieces(allPieces);
            });
        }

        window.renderPieces = (data) => {
            const listEl = document.getElementById('theater-list');
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.remove();
            listEl.innerHTML = '';

            if (data.length === 0) {
                listEl.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 italic font-serif text-lg">Votre carnet est vide. Notez votre premier spectacle !</div>';
                return;
            }

            data.forEach(piece => {
                const color = getColorByRating(piece.rating);
                const card = document.createElement('div');
                card.className = "theater-card bg-white rounded-[2.5rem] p-8 shadow-sm border border-gray-100 flex flex-col relative overflow-hidden cursor-pointer";
                card.onclick = () => openViewModal(piece.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="rating-badge w-12 h-12 rounded-xl flex items-center justify-center text-white font-black shadow-md flex-shrink-0" style="background-color: ${color}">${piece.rating}</div>
                        <button onclick="event.stopPropagation(); deletePiece('${piece.id}')" class="delete-btn text-gray-200 hover:text-red-400 p-2 transition"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 leading-tight mb-2 line-clamp-2">${piece.title}</h3>
                    <p class="text-gray-400 font-medium line-clamp-1">${piece.author}</p>
                    <div class="mt-8 flex items-center text-[10px] font-black uppercase tracking-widest text-gray-300">
                        <i class="fas fa-location-arrow mr-2"></i> <span class="truncate">${piece.venue || 'Théâtre libre'}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        };

        window.openViewModal = (id) => {
            const piece = allPieces.find(p => p.id === id);
            if (!piece) return;
            const color = getColorByRating(piece.rating);
            document.getElementById('view-header-color').style.backgroundColor = color;
            document.getElementById('view-rating').style.backgroundColor = color;
            document.getElementById('view-rating').innerText = piece.rating;
            document.getElementById('view-title').innerText = piece.title;
            document.getElementById('view-author').innerText = piece.author;
            document.getElementById('view-venue').innerText = piece.venue || 'Non précisé';
            document.getElementById('view-date').innerText = piece.viewDate ? new Date(piece.viewDate).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'}) : 'Date inconnue';
            document.getElementById('view-critique').innerText = piece.critique || "Pas de critique rédigée.";
            document.getElementById('edit-btn-trigger').onclick = () => { closeModals(); openFormModal(id); };
            document.body.classList.add('modal-open');
            document.getElementById('view-modal').classList.replace('hidden', 'flex');
        };

        window.openFormModal = (id = null) => {
            const form = document.getElementById('piece-form');
            form.reset();
            if (id) {
                const piece = allPieces.find(p => p.id === id);
                document.getElementById('form-title').innerText = "Modifier l'entrée";
                document.getElementById('edit-id').value = id;
                document.getElementById('title').value = piece.title;
                document.getElementById('author').value = piece.author;
                document.getElementById('venue').value = piece.venue || '';
                document.getElementById('view-date-input').value = piece.viewDate || '';
                document.getElementById('rating').value = piece.rating;
                document.getElementById('rating-val').innerText = piece.rating;
                document.getElementById('critique').value = piece.critique || '';
            } else {
                document.getElementById('form-title').innerText = "Nouveau Souvenir";
                document.getElementById('edit-id').value = '';
                document.getElementById('rating-val').innerText = "3";
                document.getElementById('rating').value = 3;
            }
            document.body.classList.add('modal-open');
            document.getElementById('form-modal').classList.replace('hidden', 'flex');
        };

        window.closeModals = () => {
            document.body.classList.remove('modal-open');
            document.getElementById('view-modal').classList.replace('flex', 'hidden');
            document.getElementById('form-modal').classList.replace('flex', 'hidden');
        };

        document.getElementById('piece-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const editId = document.getElementById('edit-id').value;
            const data = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                venue: document.getElementById('venue').value,
                viewDate: document.getElementById('view-date-input').value,
                rating: parseFloat(document.getElementById('rating').value),
                critique: document.getElementById('critique').value,
                userId: currentUser.uid,
                updatedAt: serverTimestamp()
            };
            try {
                if (editId) await updateDoc(doc(db, "pieces", editId), data);
                else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "pieces"), data); }
                closeModals();
            } catch (err) { console.error(err); }
        };

        window.deletePiece = async (id) => { if (confirm("Supprimer cette entrée ?")) await deleteDoc(doc(db, "pieces", id)); };

        window.filterPieces = () => {
            const s = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPieces.filter(p => p.title.toLowerCase().includes(s) || p.author.toLowerCase().includes(s));
            renderPieces(filtered);
        };
    </script>
</body>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Service Worker enregistré !'))
    .catch(err => console.error('Erreur SW:', err));
}
</script>
</html>
