<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfaf8">
    <meta name="description" content="Entracte - Mon Journal de Théâtre Personnel">
    
    <link rel="manifest" href="manifest.json">
    
    <title>Entracte - Mon Journal de Théâtre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfaf8;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .theater-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .theater-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
        }
        .rating-badge {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .action-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .theater-card:hover .action-btn {
            opacity: 1;
        }
        .critique-text {
            line-height: 1.8;
            white-space: pre-wrap;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 3px;
        }

        .modal-open {
            overflow: hidden;
        }

        .top-five-container {
            background: linear-gradient(to right, #1a1a1a, #000);
            border-radius: 2rem;
            padding: 2rem;
            margin-bottom: 3rem;
            color: white;
        }

        .top-item {
            border-left: 2px solid rgba(255,255,255,0.1);
            padding-left: 1rem;
        }

        #offline-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
            z-index: 200;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="offline-indicator"><i class="fas fa-wifi-slash mr-2"></i> Mode hors-ligne</div>

    <!-- AUTH -->
    <div id="auth-screen" class="fixed inset-0 bg-[#fcfaf8] z-[100] flex items-center justify-center p-6 text-center">
        <div class="max-w-md w-full">
            <h1 class="text-6xl font-black text-gray-900 mb-4">Entracte.</h1>
            <p class="text-gray-400 mb-12 text-lg italic">Votre carnet de loge personnel.</p>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" required placeholder="Email" class="w-full p-4 bg-white border border-gray-100 rounded-2xl outline-none shadow-sm focus:ring-2 focus:ring-black">
                <input type="password" id="auth-password" required placeholder="Mot de passe" class="w-full p-4 bg-white border border-gray-100 rounded-2xl outline-none shadow-sm focus:ring-2 focus:ring-black">
                <div class="pt-4 space-y-3">
                    <button type="submit" id="auth-submit-btn" class="w-full py-4 bg-black text-white rounded-2xl font-bold shadow-xl active:scale-95 transition-all">Se connecter</button>
                    <button type="button" id="toggle-auth-mode" class="text-sm text-gray-400 hover:text-black transition">Pas encore de compte ? S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="max-w-6xl mx-auto opacity-0 pointer-events-none transition-opacity duration-500">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-6xl font-black text-gray-900 tracking-tight">Entracte.</h1>
                <div class="flex items-center gap-3 mt-2">
                    <p id="user-display" class="text-gray-400 text-sm font-medium"></p>
                    <span class="text-gray-200">|</span>
                    <button onclick="logout()" class="text-[10px] font-black text-gray-400 hover:text-red-500 uppercase tracking-widest transition">Déconnexion</button>
                </div>
            </div>
            <button onclick="openFormModal()" class="w-full md:w-auto bg-black text-white px-10 py-5 rounded-full shadow-xl font-bold active:scale-95 transition-all">
                Nouveau souvenir
            </button>
        </header>

        <!-- TOP 5 SECTION -->
        <section id="top-five-section" class="hidden">
            <div class="top-five-container">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold flex items-center gap-3"><i class="fas fa-crown text-yellow-500"></i> Le Panthéon (Top 5)</h2>
                </div>
                <div id="top-five-list" class="grid grid-cols-1 md:grid-cols-5 gap-6">
                    <!-- Top 5 items injected here -->
                </div>
            </div>
        </section>

        <!-- FILTERS & SEARCH -->
        <div class="flex flex-col md:flex-row gap-4 mb-12 items-center">
            <div class="flex-grow relative w-full">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                <input type="text" id="search-input" oninput="applyFilters()" placeholder="Rechercher..." class="w-full pl-14 pr-6 py-4 rounded-3xl border-none shadow-sm focus:ring-2 focus:ring-black outline-none bg-white">
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <select id="sort-select" onchange="applyFilters()" class="flex-grow md:w-48 p-4 bg-white rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-black font-semibold text-sm cursor-pointer">
                    <option value="date-desc">Plus récents</option>
                    <option value="date-asc">Plus anciens</option>
                    <option value="rating-desc">Meilleures notes</option>
                    <option value="venue-asc">Par Théâtre (A-Z)</option>
                </select>
            </div>
        </div>

        <div id="theater-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-20">
            <div id="loading" class="col-span-full text-center py-20 text-gray-400 animate-pulse font-serif italic text-xl">Ouverture du rideau...</div>
        </div>
    </div>

    <!-- MODAL LECTURE -->
    <div id="view-modal" onclick="closeOnBackdrop(event)" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50 backdrop-blur-md overflow-y-auto">
        <div onclick="event.stopPropagation()" class="bg-white rounded-[2.5rem] max-w-2xl w-full shadow-2xl overflow-hidden my-auto">
            <div id="view-header-color" class="h-3 w-full"></div>
            <div class="p-8 md:p-10">
                <div class="flex justify-between items-start mb-6">
                    <div id="view-rating" class="rating-badge w-14 h-14 rounded-2xl flex items-center justify-center text-white font-black text-xl"></div>
                    <button onclick="closeModals()" class="text-gray-300 hover:text-black p-2 transition"><i class="fas fa-times text-xl"></i></button>
                </div>
                <h2 id="view-title" class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 leading-tight"></h2>
                <p id="view-author" class="text-xl text-gray-500 font-medium mb-8"></p>
                <div class="grid grid-cols-2 gap-6 mb-8 pb-8 border-b border-gray-100">
                    <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Lieu</p><p id="view-venue" class="font-semibold text-gray-800"></p></div>
                    <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Date</p><p id="view-date" class="font-semibold text-gray-800"></p></div>
                </div>
                <p id="view-critique" class="critique-text text-gray-700 italic serif text-lg"></p>
            </div>
        </div>
    </div>

    <!-- MODAL FORM -->
    <div id="form-modal" onclick="closeOnBackdrop(event)" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[60] backdrop-blur-sm overflow-y-auto">
        <div onclick="event.stopPropagation()" class="bg-white rounded-[2rem] p-8 md:p-10 max-w-xl w-full shadow-2xl my-auto">
            <h2 id="form-title" class="text-3xl font-bold mb-8">Nouveau Souvenir</h2>
            <form id="piece-form" class="space-y-5">
                <input type="hidden" id="edit-id">
                <input type="text" id="title" required placeholder="Titre de la pièce" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                <input type="text" id="author" required placeholder="Mise en scène / Compagnie" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="venue" placeholder="Le Théâtre" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                    <input type="date" id="view-date-input" required class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black">
                </div>
                <div class="space-y-3 bg-gray-50 p-4 rounded-2xl">
                    <div class="flex justify-between items-center"><label class="text-sm font-bold text-gray-500">Note</label><span class="bg-black text-white px-3 py-1 rounded-lg font-bold text-sm"><span id="rating-val">3</span> / 5</span></div>
                    <input type="range" id="rating" min="0" max="5" step="0.5" value="3" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-black">
                </div>
                <textarea id="critique" rows="4" placeholder="Votre ressenti..." class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-black"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModals()" class="flex-1 py-4 font-bold text-gray-400">Annuler</button>
                    <button type="submit" class="flex-1 py-4 bg-black text-white rounded-2xl font-bold">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, query, where, deleteDoc, doc, serverTimestamp, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdbffCQYoEj7Xq9e2kML65YtEMcTBBYO8",
            authDomain: "fir-84302.firebaseapp.com",
            projectId: "fir-84302",
            storageBucket: "fir-84302.firebasestorage.app",
            messagingSenderId: "856418485712",
            appId: "1:856418485712:web:19b408f133b2697cb5a5d5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        try { enableIndexedDbPersistence(db); } catch (err) {}
        setPersistence(auth, browserLocalPersistence);

        let currentUser = null;
        let allPieces = [];
        let unsubscribe = null;
        let isSignUp = false;

        // AUTH ELEMENTS
        const authScreen = document.getElementById('auth-screen');
        const mainContent = document.getElementById('main-content');
        const authForm = document.getElementById('auth-form');
        const toggleAuthBtn = document.getElementById('toggle-auth-mode');
        const authSubmitBtn = document.getElementById('auth-submit-btn');

        toggleAuthBtn.onclick = () => {
            isSignUp = !isSignUp;
            authSubmitBtn.innerText = isSignUp ? "Créer mon carnet" : "Se connecter";
            toggleAuthBtn.innerText = isSignUp ? "Déjà un compte ? Se connecter" : "S'inscrire";
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                if (isSignUp) await createUserWithEmailAndPassword(auth, email, password);
                else await signInWithEmailAndPassword(auth, email, password);
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                authScreen.style.display = 'none';
                mainContent.classList.replace('opacity-0', 'opacity-100');
                mainContent.classList.remove('pointer-events-none');
                loadPieces();
            } else {
                currentUser = null;
                authScreen.style.display = 'flex';
                mainContent.classList.replace('opacity-100', 'opacity-0');
                mainContent.classList.add('pointer-events-none');
                if (unsubscribe) unsubscribe();
            }
        });

        function loadPieces() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, "pieces"), where("userId", "==", currentUser.uid));
            unsubscribe = onSnapshot(q, (snapshot) => {
                allPieces = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                applyFilters();
            });
        }

        window.applyFilters = () => {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sort = document.getElementById('sort-select').value;
            
            let filtered = allPieces.filter(p => 
                p.title.toLowerCase().includes(search) || 
                p.author.toLowerCase().includes(search) || 
                (p.venue && p.venue.toLowerCase().includes(search))
            );

            filtered.sort((a, b) => {
                switch(sort) {
                    case 'date-desc': return new Date(b.viewDate || 0) - new Date(a.viewDate || 0);
                    case 'date-asc': return new Date(a.viewDate || 0) - new Date(b.viewDate || 0);
                    case 'rating-desc': return b.rating - a.rating;
                    case 'venue-asc': return (a.venue || '').localeCompare(b.venue || '');
                    default: return 0;
                }
            });

            renderPieces(filtered);
            renderTopFive();
        };

        window.renderPieces = (data) => {
            const listEl = document.getElementById('theater-list');
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
            listEl.innerHTML = '';

            data.forEach(piece => {
                const color = getColorByRating(piece.rating);
                const isTop = piece.isTopFive || false;
                const card = document.createElement('div');
                card.className = "theater-card bg-white rounded-[2.5rem] p-8 shadow-sm border border-gray-100 flex flex-col relative overflow-hidden cursor-pointer";
                card.onclick = () => openViewModal(piece.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="rating-badge w-12 h-12 rounded-xl flex items-center justify-center text-white font-black shadow-md" style="background-color: ${color}">${piece.rating}</div>
                        <div class="flex gap-2 action-btn">
                            <button onclick="event.stopPropagation(); toggleTopFive('${piece.id}')" class="p-2 ${isTop ? 'text-yellow-400' : 'text-gray-200 hover:text-yellow-400'} transition"><i class="fas fa-star"></i></button>
                            <button onclick="event.stopPropagation(); deletePiece('${piece.id}')" class="p-2 text-gray-200 hover:text-red-400 transition"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 leading-tight mb-2 line-clamp-2">${piece.title}</h3>
                    <p class="text-gray-400 font-medium line-clamp-1">${piece.author}</p>
                    <div class="mt-8 flex items-center text-[10px] font-black uppercase tracking-widest text-gray-300">
                        <i class="fas fa-calendar-alt mr-2"></i> ${piece.viewDate ? new Date(piece.viewDate).toLocaleDateString('fr-FR') : 'Date libre'}
                        <span class="mx-2">•</span>
                        <i class="fas fa-map-marker-alt mr-2"></i> ${piece.venue || 'Théâtre libre'}
                    </div>
                `;
                listEl.appendChild(card);
            });
        };

        window.renderTopFive = () => {
            const topFive = allPieces
                .filter(p => p.isTopFive)
                .sort((a, b) => (a.topRank || 99) - (b.topRank || 99))
                .slice(0, 5);
            
            const section = document.getElementById('top-five-section');
            const list = document.getElementById('top-five-list');
            
            if (topFive.length > 0) {
                section.classList.remove('hidden');
                list.innerHTML = topFive.map((p, i) => `
                    <div class="top-item relative group cursor-pointer" onclick="openViewModal('${p.id}')">
                        <span class="absolute -left-2 -top-2 w-6 h-6 bg-yellow-500 text-black text-[10px] font-black rounded-full flex items-center justify-center shadow-lg">${i+1}</span>
                        <h4 class="font-bold text-sm line-clamp-1 group-hover:text-yellow-400 transition">${p.title}</h4>
                        <p class="text-[10px] text-gray-500 truncate">${p.venue || 'Théâtre'}</p>
                        <div class="flex gap-1 mt-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="event.stopPropagation(); moveRank('${p.id}', -1)" class="text-[10px] hover:text-white text-gray-500">↑</button>
                            <button onclick="event.stopPropagation(); moveRank('${p.id}', 1)" class="text-[10px] hover:text-white text-gray-500">↓</button>
                        </div>
                    </div>
                `).join('');
            } else {
                section.classList.add('hidden');
            }
        };

        window.toggleTopFive = async (id) => {
            const piece = allPieces.find(p => p.id === id);
            const currentTop = allPieces.filter(p => p.isTopFive).length;
            if (!piece.isTopFive && currentTop >= 5) {
                alert("Votre Top 5 est déjà plein ! Retirez un spectacle pour en ajouter un nouveau.");
                return;
            }
            await updateDoc(doc(db, "pieces", id), { 
                isTopFive: !piece.isTopFive,
                topRank: piece.isTopFive ? null : currentTop + 1
            });
        };

        window.moveRank = async (id, dir) => {
            const topFive = allPieces.filter(p => p.isTopFive).sort((a, b) => (a.topRank || 0) - (b.topRank || 0));
            const idx = topFive.findIndex(p => p.id === id);
            const newIdx = idx + dir;
            if (newIdx >= 0 && newIdx < topFive.length) {
                const other = topFive[newIdx];
                await updateDoc(doc(db, "pieces", id), { topRank: other.topRank });
                await updateDoc(doc(db, "pieces", other.id), { topRank: topFive[idx].topRank });
            }
        };

        window.openFormModal = (id = null) => {
            const form = document.getElementById('piece-form');
            form.reset();
            document.getElementById('edit-id').value = id || '';
            document.getElementById('form-title').innerText = id ? "Modifier" : "Nouveau Souvenir";
            if (id) {
                const p = allPieces.find(p => p.id === id);
                document.getElementById('title').value = p.title;
                document.getElementById('author').value = p.author;
                document.getElementById('venue').value = p.venue || '';
                document.getElementById('view-date-input').value = p.viewDate || '';
                document.getElementById('rating').value = p.rating;
                document.getElementById('rating-val').innerText = p.rating;
                document.getElementById('critique').value = p.critique || '';
            } else {
                document.getElementById('rating-val').innerText = "3";
                document.getElementById('rating').value = 3;
            }
            document.getElementById('form-modal').classList.replace('hidden', 'flex');
            document.body.classList.add('modal-open');
        };

        window.closeModals = () => {
            document.getElementById('view-modal').classList.replace('flex', 'hidden');
            document.getElementById('form-modal').classList.replace('flex', 'hidden');
            document.body.classList.remove('modal-open');
        };

        // NOUVELLE FONCTION : Fermer si on clique sur l'arrière-plan
        window.closeOnBackdrop = (event) => {
            // Si l'élément cliqué est le conteneur flouté lui-même (pas la carte blanche)
            if (event.target.id === 'view-modal' || event.target.id === 'form-modal') {
                closeModals();
            }
        };

        document.getElementById('piece-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                venue: document.getElementById('venue').value,
                viewDate: document.getElementById('view-date-input').value,
                rating: parseFloat(document.getElementById('rating').value),
                critique: document.getElementById('critique').value,
                userId: currentUser.uid,
                updatedAt: serverTimestamp()
            };
            if (id) await updateDoc(doc(db, "pieces", id), data);
            else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "pieces"), data); }
            closeModals();
        };

        window.openViewModal = (id) => {
            const p = allPieces.find(p => p.id === id);
            const color = getColorByRating(p.rating);
            document.getElementById('view-header-color').style.backgroundColor = color;
            document.getElementById('view-rating').style.backgroundColor = color;
            document.getElementById('view-rating').innerText = p.rating;
            document.getElementById('view-title').innerText = p.title;
            document.getElementById('view-author').innerText = p.author;
            document.getElementById('view-venue').innerText = p.venue || 'Non spécifié';
            document.getElementById('view-date').innerText = p.viewDate ? new Date(p.viewDate).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'}) : 'Inconnue';
            document.getElementById('view-critique').innerText = p.critique || "Pas de critique.";
            document.getElementById('view-modal').classList.replace('hidden', 'flex');
            document.body.classList.add('modal-open');
        };

        window.deletePiece = async (id) => { if(confirm("Supprimer ?")) await deleteDoc(doc(db, "pieces", id)); };
        function getColorByRating(r) {
            if (r >= 4.5) return '#D4AF37'; if (r >= 4.0) return '#E67E22'; if (r >= 3.0) return '#706fd3'; if (r >= 2.0) return '#34ace0'; return '#aaa69d';
        }
        document.getElementById('rating').addEventListener('input', e => document.getElementById('rating-val').innerText = e.target.value);
    </script>
</body>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Service Worker enregistré !'))
    .catch(err => console.error('Erreur SW:', err));
}
</script>
</html>
